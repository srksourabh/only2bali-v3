<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="o2b-mark-title">
  <title id="o2b-mark-title">Only2Bali</title>
  <!--
    Candi bentar - the Balinese split gate that marks the entrance to a temple
    courtyard. Two stepped pylons on a plinth, a passage between them, and the
    sun rising through the opening.

    Four tiers, kept deliberately bold so the silhouette still reads at 20px.
    Geometry is symmetric about x=32; do not edit one pylon without mirroring
    the other.
  -->
  <circle cx="32" cy="17" r="4" fill="#e8941a"/>
  <path fill="#0e4f44" d="M27 60H10v-3h2V46h3V34h3V22h3V10h6z"/>
  <path fill="#0e4f44" d="M37 60h17v-3h-2V46h-3V34h-3V22h-3V10h-6z"/>
</svg>
