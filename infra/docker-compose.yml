# Only2Bali — full stack on the Hostinger VPS
#
#   caddy    :80/:443  public, terminates TLS
#   app      :3000     private network only
#   postgres :5432     127.0.0.1 only, never published
#
# Deploy:  docker compose --env-file .env up -d --build
# See DEPLOY.md for first-run steps.

name: only2bali

services:
  caddy:
    image: caddy:2-alpine
    container_name: o2b-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"      # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # holds the TLS certificates - do not delete
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [edge, internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    build:
      context: ../only2bali-next
      dockerfile: Dockerfile
    image: only2bali-app:latest
    container_name: o2b-app
    restart: unless-stopped
    # No ports section. The app is reachable only through Caddy.
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-only2bali}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    container_name: o2b-postgres
    restart: unless-stopped
    # Loopback only, for psql over SSH. The app reaches it over the internal
    # network instead. Changing this to "5432:5432" publishes your customer
    # data to the internet.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-only2bali}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      TZ: UTC
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - log_min_duration_statement=500
      - -c
      - log_connections=on
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt:
      - no-new-privileges:true

  backup:
    image: postgres:17-alpine
    container_name: o2b-pg-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:-only2bali}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./postgres/backups:/backups
      - ./postgres/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sh /usr/local/bin/backup.sh || echo "[backup] FAILED at $$(date -u +%FT%TZ)"
          sleep 86400
        done
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

networks:
  edge:
  internal:
    internal: true      # no route to the internet from this network

volumes:
  pgdata:
  caddy_data:
  caddy_config:
