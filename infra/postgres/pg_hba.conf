# Only2Bali — Postgres client authentication
#
# The ordering matters: the first matching line wins, so the local rules come
# first and the internet-facing rule is deliberately last and narrow.
#
# TYPE     DATABASE   USER          ADDRESS        METHOD        OPTIONS

# Unix socket inside the container: used by pg_isready, pg_dump and psql-over-SSH.
local      all        all                          scram-sha-256

# Loopback inside the container.
host       all        all           127.0.0.1/32   scram-sha-256
host       all        all           ::1/128        scram-sha-256

# Everything arriving over the network must use TLS *and* present a client
# certificate signed by our CA, whose CN must equal the connecting role.
# `hostssl` refuses plaintext. `clientcert=verify-full` is what makes a stolen
# password insufficient on its own.
hostssl    all        only2bali_app 0.0.0.0/0      scram-sha-256  clientcert=verify-full
hostssl    all        only2bali_app ::/0           scram-sha-256  clientcert=verify-full

# No `host ... trust` line exists here, and none should ever be added.
# Anything not matched above is rejected.
